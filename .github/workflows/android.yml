name: Build MoChat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Install dependencies
        working-directory: mochat
        run: flutter pub get

      - name: Build APK
        working-directory: mochat
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mochat-release-apk
          path: mochat/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
